name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android project
        run: |
          mkdir -p www
          cp Arrow_Maze.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor-community/admob@7
          echo '{"appId":"com.suleman.arrowmaze","appName":"Arrow Maze","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: AdMob App ID (this is Google's TEST id - put your own before release)
        run: |
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Maze-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
