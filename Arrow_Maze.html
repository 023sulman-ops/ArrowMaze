<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Arrow Maze</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700&display=swap"></noscript>
<style>
:root{--bg:#d8efdd;--panel:#ffffff59;--card:#fff;--ink:#1d4a45;--dot:#b3d3bd;--acc:#1a8aa3;--onacc:#fff;--ar:#e44fbf;--ah:#f5a623;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0f2019;--panel:#ffffff0f;--card:#17302a;--ink:#e6f5ee;--dot:#27443a;--acc:#4cc9f0;--onacc:#06232e;--ar:#ff6fd8;--ah:#ffb84d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg) center/cover fixed;color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;font-size:16px}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
.scr{display:none;flex:1;min-height:0;width:100%;flex-direction:column;align-items:center}
.scr.on{display:flex;animation:fin .25s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- shared ---------- */
.ib{width:2.625rem;height:2.625rem;border:0;border-radius:0.75rem;background:var(--panel);color:var(--ink);font-size:1.25rem;transition:transform .12s;flex:none}
.ib:active,.b:active,.cb:active,.lb:active,#oc:active{transform:scale(.94)}
.badge{padding:0.1875rem 0.75rem;border-radius:6.1875rem;font-size:0.875rem;font-weight:600;color:#fff;white-space:nowrap}
.t0{background:#0f9d76}.t1{background:#d88f00}.t2{background:#d6246e}
.pf{border-radius:16px;padding:3px;box-sizing:border-box;display:flex;box-shadow:0 2px 6px #0003;flex:none}
.pi{flex:1;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pi svg{width:58%;height:58%}
.dm{display:inline-flex}.dm svg{width:1rem;height:1.25rem;display:block}

/* ---------- home ---------- */
#home{max-width:520px;padding-bottom:1.125rem;box-sizing:border-box}
#htop{width:100%;box-sizing:border-box;padding:0.875rem 1rem 0.5rem;display:flex;align-items:center;gap:0.625rem}
#pbtn{position:relative;border:0;background:none;padding:0;flex:none}
.plv{position:absolute;left:50%;bottom:-0.4375rem;transform:translateX(-50%);background:#e8503a;color:#fff;font-size:0.6875rem;border-radius:0.5625rem;padding:0 0.4375rem;border:0.125rem solid var(--bg)}
#pill{margin-left:auto;display:flex;align-items:center;gap:0.375rem;background:var(--panel);padding:0.375rem 0.875rem;border-radius:6.1875rem;font-weight:600;font-size:1.25rem}
#cards{width:100%;box-sizing:border-box;display:flex;gap:0.875rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:0.625rem 1rem;scrollbar-width:none;flex:none}
#cards::-webkit-scrollbar{display:none}
.cd{flex:0 0 min(calc(44vw*var(--u,1)),12.5rem);scroll-snap-align:start;min-height:13.4375rem;border-radius:1.25rem;padding:0.875rem;color:#fff;display:flex;flex-direction:column;box-sizing:border-box;box-shadow:0 0.25rem 0.75rem #0002}
.c1{background:linear-gradient(160deg,#41d1b6,#1da58f)}.c2{background:linear-gradient(160deg,#10a58f,#0b7d70)}.c3{background:linear-gradient(160deg,#7fd1ff,#4fae7a)}
.cd h3{margin:0;font-size:1.1875rem;line-height:1.1}
.tp{display:inline-flex;align-self:flex-start;gap:0.25rem;background:#0003;border-radius:6.1875rem;padding:0.125rem 0.625rem;font-size:0.8125rem;margin-top:0.3125rem}
.ci{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:3.625rem;gap:0.125rem}
.ci small{font-size:0.75rem;opacity:.9;text-align:center;line-height:1.2}
.medal{width:4.25rem;height:4.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.125rem;color:#fff;box-shadow:inset 0 -0.25rem 0.5rem #0003,0 0.1875rem 0.5rem #0003;animation:float 3s ease-in-out infinite}
.trophy{animation:float 3s ease-in-out infinite}
.cb{border:0;border-radius:0.75rem;background:#e8fbf3;color:#0f7f78;font:600 1.0625rem var(--fb);padding:0.625rem;transition:transform .12s}
.cb:disabled{opacity:.7}
#htitle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.375rem}
h1.ttl{font-size:3rem;margin:0;color:var(--ink);opacity:.75;letter-spacing:0.0625rem;animation:float 3s ease-in-out infinite}
.ar3{display:flex;gap:0.625rem;color:var(--ar);font-size:1.625rem;overflow:hidden}.ar3 i{font-style:normal;animation:slide 1.4s ease-in-out infinite}.ar3 i:nth-child(2){animation-delay:.2s}.ar3 i:nth-child(3){animation-delay:.4s}
@keyframes slide{0%,100%{transform:translateX(-6px);opacity:.4}50%{transform:translateX(6px);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#lvls{width:100%;display:flex;justify-content:center;align-items:center;gap:0.875rem;padding:0.875rem 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.lb{border:0;border-radius:50%;width:3rem;height:3rem;color:#fff;font:600 1.0625rem var(--fb);box-shadow:0 0.125rem 0.375rem #0003;transition:transform .12s}
.lb.cur{width:4rem;height:4rem;font-size:1.4375rem;animation:pulse 1.8s infinite}
.lb0{background:#1a8aa3}.lb1{background:#6b4fc7}.lb2{background:#c2416b}
@keyframes pulse{0%{box-shadow:0 0 0 0 #6b4fc788}70%{box-shadow:0 0 0 14px #6b4fc700}100%{box-shadow:0 0 0 0 #6b4fc700}}
#oc{margin:0.375rem 1.375rem 0;width:calc(100% - 2.75rem);background:#b5415c;border:0;border-radius:0.875rem;color:#fff;font:600 1.75rem var(--fb);padding:1rem;box-shadow:0 0.25rem 0.625rem #0003;transition:transform .12s}

/* ---------- game ---------- */
#game{max-width:none}
#top{width:100%;max-width:520px;box-sizing:border-box;padding:0.5rem 0.875rem 0.5rem;display:flex;flex-direction:column;gap:0.5rem;border-bottom:1px solid var(--dot)}
#lvrow{display:flex;align-items:center;gap:0.5rem}
#lvc{flex:1;display:flex;align-items:center;justify-content:center;gap:0.5rem;min-width:0}
#lv{font-size:1.625rem;font-weight:600;letter-spacing:0.0312rem;display:inline-block;white-space:nowrap}
#lv.pop{animation:lvp .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes lvp{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#ctl{display:flex;align-items:center;gap:0.5rem}
.hb{position:relative}.adb{position:absolute;right:-0.375rem;top:-0.375rem;background:var(--acc);color:var(--onacc);font-size:0.625rem;font-weight:600;border-radius:0.5rem;padding:0.0625rem 0.3125rem}
#view{flex:1;min-height:0;width:100%;position:relative}
canvas{display:block;position:absolute;inset:0;touch-action:none}
.fb{position:absolute;bottom:0.75rem;width:3.375rem;height:3.375rem;border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 0.125rem 0.5rem #0003;display:flex;align-items:center;justify-content:center;font-size:1.5rem;transition:transform .12s,opacity .2s}
.fb:active{transform:scale(.92)}
#gb{right:0.875rem}#zr{left:0.875rem;opacity:0;pointer-events:none}#zr.on{opacity:1;pointer-events:auto}
#tip{font-size:0.875rem;opacity:.8;text-align:center;padding:0.375rem 1.5rem 0.625rem;min-height:2.125rem;max-width:480px}

/* lives: animated rain drops */
#hp{display:flex;gap:0.5rem;margin-right:auto;align-items:flex-end;min-height:2.125rem}
.dr{position:relative;width:1.625rem;height:2rem;display:inline-block}
.dr svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0.125rem 0.1875rem #0003);transform-origin:50% 90%;animation:bob 2.4s ease-in-out infinite}
.dr:nth-child(2) svg{animation-delay:-.8s}.dr:nth-child(3) svg{animation-delay:-1.6s}
.dr.gain svg{animation:pop .6s cubic-bezier(.2,1.7,.4,1),bob 2.4s ease-in-out .6s infinite}
.dr.lose svg{animation:fall .75s ease-out forwards}
.dr.x svg{animation:none;opacity:.25;transform:scale(.8)}
.dr .rg{position:absolute;left:50%;bottom:0;width:0.75rem;height:0.75rem;margin-left:-0.375rem;border:0.125rem solid #4cc9f0;border-radius:50%;opacity:0;transform:scale(.2)}
.dr.lose .rg{animation:ring .7s ease-out .15s}
.dr .sk{position:absolute;left:50%;top:62%;width:0.3125rem;height:0.3125rem;margin:-0.125rem;border-radius:50%;background:#7fdcff;opacity:0}
.dr.lose .sk{animation:spl .6s ease-out .15s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(.94,1.07)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(0) scale(1);opacity:1}30%{transform:translateY(6px) scale(1.25,.7)}60%{transform:translateY(-4px) scale(.7,1.2);opacity:.9}100%{transform:translateY(0) scale(.8);opacity:.25}}
@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(2.8)}}
@keyframes spl{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-24px) scale(.3)}}

/* ---------- settings ---------- */
#set .ib{width:42px;height:42px;font-size:20px;border-radius:12px}
.fb svg{width:1.75rem;height:1.75rem}
.sl small{display:block;font-size:13px;opacity:.6;margin-top:1px}
.seg{display:flex;gap:4px;background:var(--dot);border-radius:14px;padding:4px;margin:2px 0 14px}
.seg button{flex:1;border:0;border-radius:11px;padding:10px 4px;background:none;color:var(--ink);font:600 16px var(--fb);opacity:.7;transition:background .2s}
.seg button.on{background:var(--card);color:var(--acc);opacity:1;box-shadow:0 1px 4px #0002}
#set{max-width:520px;overflow-y:auto;padding:0 16px 28px;box-sizing:border-box;justify-content:flex-start}
#set>*{flex:none}
#sh{width:100%;display:flex;align-items:center;gap:12px;padding:16px 0}#sh h2{margin:0;font-size:26px}
.sc2{width:100%;background:var(--card);border-radius:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001;padding:4px 16px;box-sizing:border-box}
.sr{display:flex;align-items:center;gap:14px;min-height:56px;font-size:18px;color:var(--ink)}
.sr.k{cursor:pointer}.sr.k:active{opacity:.6}
.si{color:var(--acc);display:flex;opacity:.85}.sl{flex:1;opacity:.9}.ch{font-size:28px;opacity:.5}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:#aab3b8;transition:.2s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{transform:translateX(22px)}

/* ---------- modal ---------- */
#m{position:fixed;inset:0;background:#0009;display:none;flex-direction:column;gap:16px;align-items:center;justify-content:center;z-index:5}
#m.on{display:flex}
.card{background:var(--card);border-radius:18px;padding:20px;width:min(88vw,340px);max-height:80vh;overflow:auto;box-sizing:border-box;animation:cin .22s ease-out}
@keyframes cin{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
h2{margin:0 0 8px;font-size:24px}.card h3{margin:14px 0 4px;font-size:16px}
p{margin:0 0 14px;line-height:1.45;font-size:15px}.card p{font-size:14px;margin-bottom:8px}.card a{color:var(--acc);text-decoration:underline}
.card.c{text-align:center}.big{display:flex;justify-content:center;margin:8px 0}.big svg{width:34px;height:42px;animation:bob 2.4s ease-in-out infinite}
.b{display:block;width:100%;margin-top:10px;padding:13px;border:2px solid var(--acc);border-radius:12px;background:var(--acc);color:var(--onacc);font:600 17px var(--fb);transition:transform .12s}
.b:disabled{opacity:.5}.ghost{background:none;color:var(--ink);border-color:var(--dot)}.soft{background:var(--dot);color:var(--acc);border-color:transparent}.sm{display:inline-block;width:auto;margin:0 0 0 6px;padding:6px 12px;font-size:14px}
.skip{color:#fff;text-decoration:underline;font-size:19px;font-weight:600;padding:6px 20px;cursor:pointer}
.ad{height:140px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--dot) 0 10px,transparent 10px 20px);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600}
textarea{width:100%;box-sizing:border-box;border:1px solid var(--dot);border-radius:10px;background:var(--panel);color:var(--ink);font:13px monospace;padding:8px;resize:none}
.prow{display:flex;gap:12px;align-items:center;margin:12px 0}
.nm{flex:1;display:flex;align-items:center;background:var(--panel);border-radius:12px;padding:0 12px;min-width:0}
.nm input{flex:1;border:0;background:none;font:18px var(--fb);color:var(--ink);padding:14px 0;min-width:0;outline:none}
.tabs{display:flex;background:var(--panel);border-radius:12px 12px 0 0;overflow:hidden}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font:600 15px var(--fb);color:var(--ink);opacity:.55}
.tabs .on{opacity:1;color:var(--acc);background:var(--dot)}
.pgd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--dot);padding:10px;border-radius:0 0 12px 12px;max-height:210px;overflow:auto;margin-bottom:6px}
.ai{aspect-ratio:1;border:0;border-radius:10px;font-size:30px;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.ai svg{width:56%;height:56%}
.fi{border:0;background:none;padding:0;position:relative;display:flex;justify-content:center}
.sel::after{content:'✓';position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--onacc);font-size:13px;display:flex;align-items:center;justify-content:center}
.sws{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.sc{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:0 1px 4px #0003}.sc.sel{border-color:var(--ink)}.sc.sel::after{display:none}

#ld{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#ld h1{margin:0;font-size:44px;letter-spacing:1px;animation:lvp .7s cubic-bezier(.2,1.5,.4,1)}
#logo .dr{width:60px;height:74px}
.tr{width:200px;height:10px;border-radius:9px;background:var(--dot);overflow:hidden}#bar{height:100%;width:0;background:var(--acc);transition:width .2s}

/* ---------- fonts / labels ---------- */
:root{--fd:'Lilita One','Baloo 2',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif}
h1.ttl,#ld h1,h2,#lv,.lb,#oc,.badge,.cb,.b,.cd h3,#pill,.skip,.tabs button,.seg button,.plv,.lkb{font-family:var(--fd);font-weight:400;letter-spacing:.02em}
#oc .badge{background:#fff;margin-left:.5rem;font-size:1rem;vertical-align:middle}
.cd:first-child{margin-left:auto}.cd:last-child{margin-right:auto}
.pm{font-size:13px;margin:6px 0 0;text-align:center;opacity:.8}
.fi.lk .pf{opacity:.5;filter:grayscale(.6)}
.lkb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}.lkb small{font-size:11px}
/* ---------- animated profile frames ---------- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes rot{to{--a:360deg}}@keyframes pan{to{background-position:300% 0}}
@keyframes gl{0%,100%{box-shadow:0 0 3px var(--c1)}50%{box-shadow:0 0 var(--gl) 2px var(--c2)}}
.fx{position:relative;padding:4px}
.fx::before,.fx::after{content:'';position:absolute;inset:0;border-radius:inherit}
.fx::before{background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));animation:rot var(--sp) linear infinite}
.fx.fp::before{background:linear-gradient(110deg,var(--c1),var(--c2),var(--c3),var(--c1),var(--c2));background-size:300% 100%;animation:pan var(--sp) linear infinite}
.fx::after{animation:rot calc(var(--sp)*.8) linear infinite}
.fx.fo::after{background:conic-gradient(from var(--a),#0000 0 80%,#fffe)}
.fx.fs::after{background:repeating-conic-gradient(from var(--a),#fff 0 2deg,#0000 2deg 36deg)}
.fx.fo.fs::after{background:conic-gradient(from var(--a),#0000 0 80%,#fffe),repeating-conic-gradient(from calc(var(--a)*-1),#fff 0 2deg,#0000 2deg 36deg)}
.fx.fg{animation:gl 2.4s ease-in-out infinite}
.fx .pi{position:relative;z-index:2;border-radius:12px}
@media(prefers-reduced-motion:reduce){.fx,.fx::before,.fx::after{animation:none!important}}

/* ---------- start-up intro ---------- */
#ld{transition:opacity .25s;cursor:pointer;gap:0}
#ld.out{opacity:0;pointer-events:none}
#wm{display:flex;flex-direction:column;align-items:center;gap:8px}
#wt{display:flex;font-family:var(--fd);font-size:clamp(44px,14vw,64px);line-height:1;color:var(--ink);letter-spacing:.02em}
#wt i{font-style:normal;display:inline-block;opacity:0;animation:lt .38s cubic-bezier(.2,1.6,.4,1) calc(.05s + var(--i)*.045s) forwards}
@keyframes lt{from{opacity:0;transform:translateY(16px) scale(.7)}to{opacity:1;transform:none}}
#aw{width:100%;height:auto;overflow:visible}
#aw path{fill:none;stroke:var(--ar);stroke-width:7;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1.01;animation:dr .55s cubic-bezier(.3,0,.2,1) .2s forwards}
#aw polygon{fill:var(--ar);opacity:0;animation:hm .55s cubic-bezier(.3,0,.2,1) .2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes hm{from{opacity:0;transform:translateX(-170px)}8%{opacity:1}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#ld *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ---------- stylish home ---------- */
#home{position:relative;isolation:isolate}
#home::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 6%,#41d1b640,transparent 42%),radial-gradient(circle at 92% 58%,#e44fbf24,transparent 42%),radial-gradient(var(--dot) 1.2px,transparent 1.7px) 0 0/22px 22px}
#who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
#who b{font:400 1.05rem var(--fd);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#who small{font-size:.75rem;font-weight:700;opacity:.65;white-space:nowrap}
#pill,.ib{border:1px solid #fff6;box-shadow:0 .15rem .4rem #0001}
h1.ttl{font-size:clamp(2.6rem,13vw,3.4rem);opacity:1;background:linear-gradient(90deg,var(--acc),#a78bfa 50%,var(--ar));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .15rem 0 #0002)}
#tag{margin:0;font-size:.9rem;font-weight:700;opacity:.7;text-align:center;max-width:16rem;line-height:1.3}
.cd{position:relative;overflow:hidden;border-radius:1.5rem;border:1px solid #fff4;box-shadow:0 .5rem 1.1rem #0003,inset 0 1px 0 #fff5}
.cd::before{content:'';position:absolute;top:-35%;right:-30%;width:90%;height:90%;border-radius:50%;background:radial-gradient(circle,#fff4,transparent 65%);pointer-events:none}
.cd>*{position:relative}
.c1{background:linear-gradient(160deg,#4fe0c3,#16988a)}.c2{background:linear-gradient(160deg,#8b6bff,#5b3fd1)}
.c2 .cb{color:#5b3fd1}
.cb{border-radius:6rem;background:#fff;box-shadow:0 .2rem 0 #0002;font-size:1.15rem}
#lvls{align-items:flex-start;gap:.875rem;padding:.75rem 0}
.lw{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding-top:.5rem}
.lw.cur{padding-top:0}
.lw:not(:last-child)::after{content:'';position:absolute;top:2rem;left:100%;width:.875rem;height:.25rem;background:var(--dot);transform:translateY(-50%)}
.lw small{font:700 .7rem var(--fb);opacity:.75}
.lw.cur small{font-size:.8rem;opacity:1}
#oc{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:1.6rem;padding:.8rem 1rem;background:linear-gradient(135deg,#ff7a59,#c2416b);border-radius:1.1rem;box-shadow:0 .3rem 0 #8e2f4a,0 .6rem 1rem #0003}
#oc small{font:700 .78rem var(--fb);letter-spacing:0;opacity:.92}
</style>

/* ================= level generator: every new arrow's exit path is free of earlier arrows, so the level is always solvable ================= */
function gen(n,seed){const R=seed?mul(seed):Math.random;let best=null;for(let k=0;k<8;k++){const r=gen1(n,R);if(!best||r.empty<best.empty)best=r;if(!r.empty)break}return best}

for(const e of ds){const nx=cx+DIRS[e][0],ny=cy+DIRS[e][1];if(ok(nx,ny)&&!used.has(ny*W+nx)){cx=nx;cy=ny;pd=e;used.add(ny*W+nx);cells.push([nx,ny]);mv=1;break}}
if(!mv)break}
if(cells.length<2)continue;

/* fill EVERY cell: grow arrows / add new ones, each change verified with an exact solvability check */
const solv=()=>{const n=A.length,ind=Array(n).fill(0),adj=Array.from({length:n},()=>[]);

while(x>=0&&y>=0&&x<W&&y<H){const o=grid[y][x];if(o>=0&&o!=last){if(o==a.id)return false;adj[o].push(a.id);ind[a.id]++;last=o}x+=dx;y+=dy}}

const tryFlip=(x,y)=>{for(const e of sh([0,1,2,3])){const tx=x+DIRS[e][0],ty=y+DIRS[e][1];if(tx<0||ty<0||tx>=W||ty>=H)continue;const id=grid[ty][tx];if(id<0)continue;const a=A[id],t=a.cells[a.L-1];if(t[0]!=tx||t[1]!=ty||a.L>=lim)continue;

const tryTail=(x,y)=>{for(const e of sh([0,1,2,3])){const tx=x+DIRS[e][0],ty=y+DIRS[e][1];if(tx<0||ty<0||tx>=W||ty>=H)continue;const id=grid[ty][tx];if(id<0)continue;const a=A[id],t=a.cells[a.L-1];if(t[0]!=tx||t[1]!=ty||a.L>=lim)continue;

const tryNew=(x,y)=>{for(const e of sh([0,1,2,3])){const nx=x+DIRS[e][0],ny=y+DIRS[e][1];if(!ok(nx,ny))continue;

A.pop();a.cells=oc;a.L=oc.length;oc.forEach(([cx,cy])=>grid[cy][cx]=id);grid[y][x]=-1}}return 0};

function ray(a){const[dx,dy]=DIRS[a.d];let x=a.hx+dx,y=a.hy+dy,n=0;while(x>=0&&y>=0&&x<G.W&&y<G.H&&G.grid[y][x]<0){n++;x+=dx;y+=dy}return{n,b:x>=0&&y>=0&&x<G.W&&y<G.H?G.grid[y][x]:-1}}

if(r.b<0){a.st=1;a.to=r.n+a.L+1;a.cells.forEach(([x,y])=>G.grid[y][x]=-1);sfx.out();vib(15)}
else{a.st=2;a.fr=r.n;a.t0=performance.now();a.hit=0;a.bl=r.b}}

/* ================= view: pinch zoom + drag ================= */
let VW=0,VH=0,D=1,Z=1,ox=0,oy=0,CS=20,CZ=20;const ZMIN=.6,ZMAX=3;
function clampView(){const gw=G.W*CZ,gh=G.H*CZ,m=60;

let q=pt(o);g.beginPath();g.moveTo(q[0],q[1]);for(let i=Math.floor(o)+1;i<=Math.floor(e);i++)g.lineTo(P[i][0]*CZ,P[i][1]*CZ);const h=pt(e);g.lineTo(h[0],h[1]);g.stroke();

async function nativeAd(k,cb,back){const A=AM();let got=0,fin=0;const hs=[];
 const clean=()=>{hs.forEach(h=>{try{h.remove()}catch(e){}});adBusy=0;music()};
 const done=()=>{if(fin)return;fin=1;clean();if(k=='i'){cb()}else if(got){closeM();cb()}else back?back():closeM()};
 const fail=()=>{if(fin)return;fin=1;clean();if(k=='i')cb();else note('Ad is not available right now. Please try again later.',back)};
 adBusy=1;music();
 try{const E=k=='r'?['onRewardedVideoAdDismissed','onRewardedVideoAdFailedToLoad','onRewardedVideoAdFailedToShow']:['interstitialAdDismissed','interstitialAdFailedToLoad','interstitialAdFailedToShow'];
  if(k=='r')hs.push(await A.addListener('onRewardedVideoAdReward',()=>{got=1}));
  hs.push(await A.addListener(E[0],done),await A.addListener(E[1],fail),await A.addListener(E[2],fail));
  if(k=='r'){await A.prepareRewardVideoAd({adId:adId('rew'),isTesting:ADS.test});await A.showRewardVideoAd()}
  else{await A.prepareInterstitial({adId:adId('int'),isTesting:ADS.test});await A.showInterstitial()}
 }catch(e){fail()}}
function ad(k,cb,ttl,back){if(k=='i'&&S.lvl<=ADS_FROM){cb();return}
 if(AM()&&adsOK){nativeAd(k,cb,back);return}
 let n=k=='i'?3:5,iv;modal(`<h2>${ttl}</h2><div class="ad">Test ad placeholder<br>(real AdMob ads run in the Android app)</div><button class="b" id="ab" disabled></button>${k=='r'?'<button class="b ghost" id="nt">No thanks</button>':''}`);
 const b=$('#ab'),nt=$('#nt'),tick=()=>{if(n>0)b.textContent=(k=='r'?'Reward in ':'Close in ')+n+'s';else{b.disabled=0;b.textContent=k=='r'?'Claim reward':'Close';clearInterval(iv)}};
 iv=setInterval(()=>{n--;tick()},1000);tick();
 b.onclick=()=>{clearInterval(iv);closeM();cb()};
 if(nt)nt.onclick=()=>{clearInterval(iv);back?back():closeM()}}

/* ================= game flow ================= */
function hint(){if(over||scr!='game')return;ad('r',()=>{const f=G.A.filter(a=>!a.st&&ray(a).b<0);if(f.length){G.hint=f[Math.random()*f.length|0].id;G.ht=performance.now()+3000}},'Free hint')}
function revive(){lives=1;over=0;hearts()}
function skipLvl(){S.lvl++;save();start()}
function gameOver(){sfx.lose();
 if(curMode=='one'){modal(`<h2>One Chance!</h2><div class="big">${DSVG}</div><p>You hit an arrow. Try again?</p><button class="b" onclick="ad('i',start,'Ad')">Try again</button><button class="b soft" onclick="home()">Home</button>`,'c');return}
 modal(`<h2>Out of Lives!</h2><div class="big">${DSVG}</div><p>Watch an ad to get 1 more life.</p><button class="b" onclick="ad('r',revive,'Extra life',gameOver)">▶ Continue</button><button class="b soft" onclick="ad('i',start,'Ad',gameOver)">Restart</button>`,
  curMode=='daily'?'':`<a class="skip" onclick="ad('r',skipLvl,'Skip level',gameOver)">Skip</a>`);
 if(curMode!='daily')$('#m .card').classList.add('c');else $('#m .card').classList.add('c')}
function win(){sfx.win();vib(80);
 if(curMode=='daily'){S.daily={d:today(),done:1};S.drops+=5;save();modal(`<h2>Daily complete!</h2><p>+5 💧 drops. Come back tomorrow for a new challenge.</p><button class="b" onclick="home()">Home</button>`,'c');return}
 const bonus=curMode=='one'?3:1;S.drops+=bonus;S.lvl++;S.done++;save();
 modal(`<h2>Level complete</h2><p>+${bonus} 💧 drops<br>Next: Level ${S.lvl}, ${TIER[(S.lvl-1)%3]}.</p><button class="b" onclick="nxt()">Next level</button><button class="b ghost" onclick="home()">Home</button>`,'c')}
function nxt(){curMode='normal';S.done%2==0?ad('i',start,'Ad'):start()}

/* ================= boot ================= */
function back(){const m=$('#m').classList.contains('on');
 if(m){if(over&&scr=='game')home();else closeM();return}
 if(scr=='set')showScr(prevScr);else if(scr=='game')home();else{try{window.Capacitor.Plugins.App.exitApp()}catch(e){}}}
try{window.Capacitor.Plugins.App.addListener('backButton',back)}catch(e){}
theme();applyUI();start();showScr('home');requestAnimationFrame(loop);
try{new ResizeObserver(()=>G&&fit()).observe($('#view'))}catch(e){}
{const ld=$('#ld');$('#wt').innerHTML=[...'Arrow Maze'].map((c,i)=>`<i style="--i:${i}">${c==' '?'&nbsp;':c}</i>`).join('');
 let gone=0;const go=()=>{if(gone)return;gone=1;ld.classList.add('out');setTimeout(()=>ld.remove(),260);started=1;music();adsInit()};
 ld.onclick=go;setTimeout(go,matchMedia('(prefers-reduced-motion: reduce)').matches?300:1000);
 document.addEventListener('pointerdown',()=>{try{AC&&AC.resume()}catch(e){}},{once:true})}
</script>
